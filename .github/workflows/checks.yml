name: Grade checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated_grade_ci
          POSTGRES_DB: grade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      PORT: '3100'
      DATABASE_URL: postgresql://postgres:isolated_grade_ci@127.0.0.1:5432/grade_test
      DATABASE_SSL: 'false'
      BETTER_AUTH_URL: http://127.0.0.1:3100
      BETTER_AUTH_SECRET: isolated-grade-ci-secret-only-not-for-production-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grade-test-results
          path: |
            test-results/
            playwright-report/
            package-lock.json
          retention-days: 7
