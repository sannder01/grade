name: Grade checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated_grade_ci
          POSTGRES_DB: grade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      PORT: '3100'
      DATABASE_URL: postgresql://postgres:isolated_grade_ci@127.0.0.1:5432/grade_test
      DATABASE_SSL: 'false'
      DATABASE_SCHEMA: grade_ci
      BETTER_AUTH_URL: http://127.0.0.1:3100
      TRUSTED_ORIGINS: http://127.0.0.2:3100
      BETTER_AUTH_SECRET: isolated-grade-ci-secret-only-not-for-production-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build:glass
      - run: npm run build:motion
      - run: npm run build:flow
      - run: git diff --exit-code -- public/assets/
      - run: npm run check
      - run: npm test
      - run: node scripts/setup-ci.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Check registration origins on production domains
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/check-production.mjs
        env:
          GRADE_CHECK_ORIGINS: https://grade-rho-eight.vercel.app,https://grade-sanders-projects-2d7568a0.vercel.app
      - name: Prepare visual review output
        if: always()
        run: node scripts/ci-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grade-test-results
          path: |
            test-results/
            playwright-report/
            package-lock.json
          retention-days: 7
